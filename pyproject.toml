[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diagrun"
version = "0.1.0"
description = "Agent-native C++ diagnostic reducer"
requires-python = ">=3.9"

[project.scripts]
diagrun = "diagrun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
